[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-plugin"
version = "0.1.0"
description = "Minimal Culture plug-in"
readme = "README.md"
requires-python = ">=3.10"

[project.entry-points."culture.plugins"]
minimal_plugin = "minimal_plugin:setup"
