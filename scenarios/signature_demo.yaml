name: signature_demo
description: Demo scenario showcasing evaluation hooks for coalition and sentiment tracking
goal: Agents collaborate to sign a shared plan while monitoring group dynamics
steps: 30
beats:
  - proposal
  - critique
  - vote
  - deliverable
prompts:
  proposal: >-
    Kick off the project by proposing a plan for everyone to sign.
  critique: >-
    Review and refine the proposal, noting strengths and weaknesses.
  vote: >-
    Decide whether to adopt the proposal.
  deliverable: >-
    Summarize the approved plan and outline next steps.
evaluation_hooks:
  - coalitions
  - sentiment
  - collective_du
  - collective_ip
evaluation_targets:
  coalitions:
    max_count: 1
  sentiment:
    max_variance: 0.25
  collective_du:
    max_delta: 5.0
  collective_ip:
    max_delta: 5.0
